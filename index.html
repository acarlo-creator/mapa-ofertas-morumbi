<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mapa de Ofertas - Leroy Merlin Morumbi</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; }
    body, html { 
      margin: 0; padding: 0; width: 100%; height: 100%; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: #0b0f19; color: #fff; overflow: hidden;
    }
    
    /* Header Minimalista Tech */
    #header {
      position: absolute; top: 12px; left: 12px; right: 12px; height: 50px;
      background: rgba(15, 23, 42, 0.85); display: flex; align-items: center;
      justify-content: space-between; padding: 0 16px; z-index: 1000;
      border-radius: 10px; border: 1px solid rgba(0, 230, 92, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); backdrop-filter: blur(12px);
    }
    .brand-title { font-size: 13px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: #00e65c; display: flex; align-items: center; gap: 8px; }
    .brand-title::before { content: ""; display: inline-block; width: 8px; height: 8px; background: #00e65c; border-radius: 50%; box-shadow: 0 0 10px #00e65c; }
    #header .badge { 
      background: rgba(229, 57, 53, 0.2); color: #ff4d4d; border: 1px solid #e53935;
      padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; 
      letter-spacing: 0.5px; animation: pulse 1.8s infinite; 
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.03); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Area do Mapa (Fundo escuro sem sobras brancas) */
    #map { 
      width: 100vw; height: calc(100vh - 74px); margin-top: 74px; 
      background: #0b0f19; z-index: 1; 
    }

    /* Marcador Estilo Pulse Neon */
    .custom-neon-pin {
      width: 20px; height: 20px; background: #00e65c; border-radius: 50%;
      border: 3px solid #ffffff; box-shadow: 0 0 15px #00e65c, 0 0 25px #00e65c;
      animation: pinGlow 1.5s infinite alternate; cursor: pointer;
    }
    @keyframes pinGlow {
      from { box-shadow: 0 0 8px #00e65c; }
      to { box-shadow: 0 0 20px #00e65c, 0 0 30px #00e65c; }
    }

    /* Popups Clean & Tech */
    .leaflet-popup-content-wrapper { 
      border-radius: 12px; padding: 0; overflow: hidden; 
      background: rgba(15, 23, 42, 0.95) !important; color: #fff;
      box-shadow: 0 12px 35px rgba(0,0,0,0.7); border: 1px solid rgba(0, 230, 92, 0.4); 
      backdrop-filter: blur(10px);
    }
    .leaflet-popup-tip { background: rgba(15, 23, 42, 0.95); }
    .leaflet-popup-content { margin: 0 !important; width: 220px !important; }
    
    .card-oferta { padding: 14px; text-align: center; }
    .card-oferta .tag-campanha { 
      display: inline-block; background: rgba(0, 230, 92, 0.15); color: #00e65c; 
      border: 1px solid rgba(0, 230, 92, 0.4); font-size: 9px; font-weight: 800; 
      padding: 3px 8px; border-radius: 4px; text-transform: uppercase; margin-bottom: 6px; 
    }
    .card-oferta h3 { margin: 0 0 6px 0; font-size: 14px; color: #ffffff; line-height: 1.2; font-weight: 700; }
    .card-oferta img { width: 100%; height: 100px; object-fit: cover; border-radius: 6px; margin: 4px 0; border: 1px solid rgba(255,255,255,0.1); }
    .card-oferta .preco-container { margin-top: 6px; background: rgba(255,255,255,0.05); padding: 6px; border-radius: 6px; }
    .card-oferta .preco-de { text-decoration: line-through; color: #64748b; font-size: 11px; }
    .card-oferta .preco-por { color: #00e65c; font-size: 18px; font-weight: 900; margin-top: 1px; }
    
    .btn-rota {
      margin-top: 10px; width: 100%; background: #00e65c; color: #0b0f19;
      border: none; padding: 9px; border-radius: 6px; font-weight: 900;
      cursor: pointer; font-size: 10px; display: flex; align-items: center; justify-content: center; gap: 4px;
      box-shadow: 0 0 15px rgba(0,230,92,0.4); transition: all 0.2s; text-transform: uppercase;
    }
    .btn-rota:hover { background: #00c74e; box-shadow: 0 0 20px rgba(0,230,92,0.7); }

    #coords-debug {
      position: absolute; bottom: 16px; left: 16px; z-index: 1000;
      background: rgba(15, 23, 42, 0.9); color: #00e65c; padding: 6px 12px;
      font-family: monospace; font-size: 10px; border-radius: 6px; 
      border: 1px solid rgba(0, 230, 92, 0.3); pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="header">
    <div class="brand-title">LEROY MERLIN MORUMBI</div>
    <span class="badge">🔥 OFERTAS ATIVAS</span>
  </div>

  <div id="map"></div>
  <div id="coords-debug">X: <b>0</b> | Y: <b>0</b></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const SPREADSHEET_ID = "1RWr4CHQMpYEIuBJ69SDULHmwxI1-4As0BuWrQSbrSG8";
    const GID = "2013806288";
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GID}`;

    const bounds = [[0, 0], [1000, 1000]];
    
    const map = L.map('map', {
      crs: L.CRS.Simple,
      maxBounds: bounds,
      minZoom: -1.2,
      maxZoom: 2,
      zoomSnap: 0.1,
      attributionControl: false
    });

    const imageUrl = 'mapa-loja.png';
    L.imageOverlay(imageUrl, bounds).addTo(map);
    
    // Centraliza o mapa perfeitamente
    map.fitBounds(bounds);

    let linhaRotaAtual = null;

    map.on('click', function(e) {
      const y = Math.round(e.latlng.lat);
      const x = Math.round(e.latlng.lng);
      document.getElementById('coords-debug').innerHTML = `X: <b>${x}</b> | Y: <b>${y}</b>`;
    });

    // Marcador Tecnológico Personalizado (Neon Pin)
    const neonIcon = L.divIcon({
      className: 'custom-neon-pin',
      iconSize: [20, 20],
      iconAnchor: [10, 10]
    });

    function desenharRota(strRota) {
      if (linhaRotaAtual) {
        map.removeLayer(linhaRotaAtual);
      }

      if (!strRota) return;

      try {
        const pontos = strRota.split(';').map(ponto => {
          const [x, y] = ponto.split(',').map(Number);
          return [y, x];
        });

        linhaRotaAtual = L.polyline(pontos, {
          color: '#00e65c',
          weight: 5,
          dashArray: '8, 8',
          lineCap: 'round'
        }).addTo(map);

        map.fitBounds(linhaRotaAtual.getBounds(), { padding: [40, 40] });
      } catch(e) {
        console.error("Erro ao desenhar rota:", e);
      }
    }

    async function carregarOfertas() {
      try {
        const response = await fetch(CSV_URL);
        const textData = await response.text();

        const lines = textData.split('\n');
        if (lines.length < 2) return;

        const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));

        for (let i = 1; i < lines.length; i++) {
          if (!lines[i].trim()) continue;

          const values = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
          const item = {};
          
          headers.forEach((header, index) => {
            let val = values[index] ? values[index].trim() : '';
            val = val.replace(/^"|"$/g, '');
            item[header] = val;
          });

          if (String(item.ativo).trim() === "1") {
            const posX = parseFloat(item.x);
            const posY = parseFloat(item.y);

            if (!isNaN(posX) && !isNaN(posY)) {
              const card = document.createElement('div');
              card.className = 'card-oferta';
              card.innerHTML = `
                <span class="tag-campanha">${item.titulo_campanha || 'Oferta'}</span>
                <h3>${item.produto_destaque || ''}</h3>
                ${item.foto_url ? `<img src="${item.foto_url}" alt="Foto">` : ''}
                <div class="preco-container">
                  ${item.preco_de ? `<div class="preco-de">De: R$ ${item.preco_de}</div>` : ''}
                  <div class="preco-por">Por: R$ ${item.preco_por}</div>
                </div>
              `;

              if (item.rota && item.rota.trim() !== "") {
                const btn = document.createElement('button');
                btn.className = 'btn-rota';
                btn.innerHTML = '🚶‍♂️ Ver Caminho Até Aqui';
                btn.onclick = () => desenharRota(item.rota);
                card.appendChild(btn);
              }

              const marker = L.marker([posY, posX], { icon: neonIcon }).addTo(map).bindPopup(card);

              marker.on('click', () => {
                if (item.rota) desenharRota(item.rota);
              });
            }
          }
        }
      } catch (err) {
        console.error("Erro ao carregar dados da planilha:", err);
      }
    }

    carregarOfertas();
  </script>
</body>
</html>
