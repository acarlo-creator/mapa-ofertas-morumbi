<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mapa de Ofertas - Leroy Merlin Morumbi</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; }
    body, html { 
      margin: 0; padding: 0; width: 100%; height: 100%; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: #0b0f19; color: #fff; overflow: hidden;
    }
    
    #header {
      position: absolute; top: 10px; left: 10px; right: 10px; height: 55px;
      background: rgba(15, 23, 42, 0.9); display: flex; align-items: center;
      justify-content: space-between; padding: 0 12px; z-index: 1000;
      border-radius: 10px; border: 1px solid rgba(0, 230, 92, 0.4);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6); backdrop-filter: blur(12px);
    }
    
    .origem-selector { display: flex; align-items: center; gap: 6px; }
    .origem-selector label { font-size: 11px; font-weight: 800; color: #00e65c; text-transform: uppercase; }
    .origem-selector select {
      background: #1e293b; color: #fff; border: 1px solid rgba(0, 230, 92, 0.5);
      padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; outline: none;
    }

    #map { width: 100vw; height: calc(100vh - 75px); margin-top: 75px; background: #0b0f19; z-index: 1; }

    .custom-neon-pin {
      width: 22px; height: 22px; background: #00e65c; border-radius: 50%;
      border: 3px solid #ffffff; box-shadow: 0 0 15px #00e65c;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 900; color: #0b0f19;
      animation: pinGlow 1.5s infinite alternate; cursor: pointer;
    }
    @keyframes pinGlow {
      from { box-shadow: 0 0 6px #00e65c; }
      to { box-shadow: 0 0 18px #00e65c; }
    }

    .leaflet-popup-content-wrapper { 
      border-radius: 12px; padding: 0; overflow: hidden; 
      background: rgba(15, 23, 42, 0.95) !important; color: #fff;
      box-shadow: 0 12px 35px rgba(0,0,0,0.7); border: 1px solid rgba(0, 230, 92, 0.4); 
    }
    .leaflet-popup-tip { background: rgba(15, 23, 42, 0.95); }
    .leaflet-popup-content { margin: 0 !important; width: 220px !important; }
    
    .card-oferta { padding: 14px; text-align: center; }
    .card-oferta .tag-placa {
      display: inline-block; background: #00e65c; color: #0b0f19; 
      font-size: 10px; font-weight: 900; padding: 3px 8px; border-radius: 4px; 
      text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px;
    }
    .card-oferta h3 { margin: 0 0 6px 0; font-size: 14px; color: #ffffff; font-weight: 700; line-height: 1.2; }
    .card-oferta img { width: 100%; height: 95px; object-fit: cover; border-radius: 6px; margin: 4px 0; border: 1px solid rgba(255,255,255,0.1); }
    .card-oferta .preco-container { margin-top: 6px; background: rgba(255,255,255,0.05); padding: 6px; border-radius: 6px; }
    .card-oferta .preco-de { text-decoration: line-through; color: #64748b; font-size: 10px; }
    .card-oferta .preco-por { color: #00e65c; font-size: 18px; font-weight: 900; }
    
    .btn-rota {
      margin-top: 10px; width: 100%; background: #00e65c; color: #0b0f19;
      border: none; padding: 9px; border-radius: 6px; font-weight: 900;
      cursor: pointer; font-size: 10px; display: flex; align-items: center; justify-content: center; gap: 4px;
      text-transform: uppercase; transition: all 0.2s;
    }
    .btn-rota:hover { background: #00c74e; }
  </style>
</head>
<body>

  <div id="header">
    <div class="origem-selector">
      <label for="select-origem">📍 Estou em:</label>
      <select id="select-origem" onchange="atualizarPontoOrigem()">
        <option value="430,140">Entrada Principal</option>
        <option value="290,275">Iluminação</option>
        <option value="610,600">Tintas</option>
        <option value="540,370">Jardim</option>
        <option value="280,470">Decoração</option>
        <option value="450,600">Cozinhas</option>
        <option value="275,675">Pisos e Revestimentos</option>
        <option value="635,895">Materiais de Construção</option>
        <option value="655,370">Ferramentas</option>
        <option value="745,600">Ferragens</option>
        <option value="785,400">Materiais Elétricos</option>
        <option value="775,755">Madeiras</option>
        <option value="470,245">Caixas</option>
      </select>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const SPREADSHEET_ID = "1RWr4CHQMpYEIuBJ69SDULHmwxI1-4As0BuWrQSbrSG8";
    const GID = "2013806288";
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GID}`;

    const bounds = [[0, 0], [1000, 1000]];
    const map = L.map('map', {
      crs: L.CRS.Simple,
      maxBounds: bounds,
      minZoom: -1.2,
      maxZoom: 2,
      zoomSnap: 0.1,
      attributionControl: false
    });

    L.imageOverlay('mapa-loja.png', bounds).addTo(map);
    map.fitBounds(bounds);

    let linhaRotaAtual = null;
    let marcadorOrigem = null;
    const CORREDOR_CENTRAL = [450, 450];

    function obterCoordenadasOrigem() {
      const val = document.getElementById('select-origem').value;
      const [x, y] = val.split(',').map(Number);
      return [x, y];
    }

    function atualizarPontoOrigem() {
      const [x, y] = obterCoordenadasOrigem();
      if (marcadorOrigem) map.removeLayer(marcadorOrigem);
      
      const origemIcon = L.divIcon({
        className: '',
        html: '<div style="background:#38bdf8; width:16px; height:16px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 10px #38bdf8;"></div>',
        iconSize: [16, 16],
        iconAnchor: [8, 8]
      });

      marcadorOrigem = L.marker([y, x], { icon: origemIcon }).addTo(map).bindTooltip("Você está aqui", { permanent: true, direction: "top" });
    }

    // Calcula o deslocamento no mapa com base no número da placa e range lidos da planilha
    function calcularOffsetPlaca(baseX, baseY, placaNumStr, rangeStr) {
      const placa = parseInt(placaNumStr) || 1;
      
      let maxPlacas = 20;
      if (rangeStr) {
        const nums = rangeStr.match(/\d+/g);
        if (nums && nums.length > 0) {
          maxPlacas = parseInt(nums[nums.length - 1]);
        }
      }

      // Distribui o deslocamento horizontalmente e verticalmente no setor
      const proporcao = Math.min(Math.max(placa / maxPlacas, 0.05), 1.0);
      const offsetX = Math.round(baseX + (proporcao - 0.5) * 80);
      const offsetY = Math.round(baseY + (proporcao - 0.5) * 40);

      return { x: offsetX, y: offsetY };
    }

    function GERAR_ROTA_AUTOMATICA(destX, destY) {
      if (linhaRotaAtual) map.removeLayer(linhaRotaAtual);

      const [origX, origY] = obterCoordenadasOrigem();

      const pontosRota = [
        [origY, origX],
        [origY, CORREDOR_CENTRAL[0]],
        [destY, CORREDOR_CENTRAL[0]],
        [destY, destX]
      ];

      linhaRotaAtual = L.polyline(pontosRota, {
        color: '#00e65c',
        weight: 6,
        dashArray: '8, 8',
        lineCap: 'round'
      }).addTo(map);

      map.fitBounds(linhaRotaAtual.getBounds(), { padding: [50, 50] });
    }

    async function carregarOfertas() {
      atualizarPontoOrigem();

      try {
        const response = await fetch(CSV_URL);
        const textData = await response.text();

        const lines = textData.split('\n');
        if (lines.length < 2) return;

        const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));

        for (let i = 1; i < lines.length; i++) {
          if (!lines[i].trim()) continue;

          const values = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
          const item = {};
          
          headers.forEach((header, index) => {
            let val = values[index] ? values[index].trim() : '';
            val = val.replace(/^"|"$/g, '');
            item[header] = val;
          });

          if (String(item.ativo).trim() === "1") {
            const baseX = parseFloat(item.x);
            const baseY = parseFloat(item.y);

            if (!isNaN(baseX) && !isNaN(baseY)) {
              // Calcula a posição exata da placa usando os dados da planilha
              const pos = calcularOffsetPlaca(baseX, baseY, item.placa_corredor, item.range_placas);

              const neonIcon = L.divIcon({
                className: 'custom-neon-pin',
                html: `📍`,
                iconSize: [22, 22],
                iconAnchor: [11, 11]
              });

              const card = document.createElement('div');
              card.className = 'card-oferta';
              card.innerHTML = `
                <span class="tag-placa">📍 PLACA ${item.placa_corredor || 'CORREDOR'}</span>
                <h3>${item.produto_destaque || ''}</h3>
                ${item.foto_url ? `<img src="${item.foto_url}" alt="Foto">` : ''}
                <div class="preco-container">
                  ${item.preco_de ? `<div class="preco-de">De: R$ ${item.preco_de}</div>` : ''}
                  <div class="preco-por">Por: R$ ${item.preco_por}</div>
                </div>
              `;

              const btn = document.createElement('button');
              btn.className = 'btn-rota';
              btn.innerHTML = '🚶‍♂️ Traçar Rota Até Esta Placa';
              btn.onclick = () => GERAR_ROTA_AUTOMATICA(pos.x, pos.y);
              card.appendChild(btn);

              const marker = L.marker([pos.y, pos.x], { icon: neonIcon }).addTo(map).bindPopup(card);

              marker.on('click', () => {
                GERAR_ROTA_AUTOMATICA(pos.x, pos.y);
              });
            }
          }
        }
      } catch (err) {
        console.error("Erro ao carregar dados da planilha:", err);
      }
    }

    carregarOfertas();
  </script>
</body>
</html>
