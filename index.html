<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mapa de Ofertas - Leroy Merlin Morumbi</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; }
    body, html { 
      margin: 0; padding: 0; width: 100%; height: 100%; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: #0b0f19; color: #fff; overflow: hidden;
    }
    
    #header {
      position: absolute; top: 10px; left: 10px; right: 10px; height: 55px;
      background: rgba(15, 23, 42, 0.9); display: flex; align-items: center;
      justify-content: space-between; padding: 0 12px; z-index: 1000;
      border-radius: 10px; border: 1px solid rgba(0, 230, 92, 0.4);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6); backdrop-filter: blur(12px);
    }
    
    .origem-selector { display: flex; align-items: center; gap: 6px; }
    .origem-selector label { font-size: 11px; font-weight: 800; color: #00e65c; text-transform: uppercase; }
    .origem-selector select {
      background: #1e293b; color: #fff; border: 1px solid rgba(0, 230, 92, 0.5);
      padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; outline: none;
    }

    #map { width: 100vw; height: calc(100vh - 75px); margin-top: 75px; background: #0b0f19; z-index: 1; }

    /* Ponto GPS Azul Discreto */
    .gps-user-pin {
      width: 16px; height: 16px; background: #38bdf8; border-radius: 50%;
      border: 3px solid #ffffff; box-shadow: 0 0 12px #38bdf8;
      animation: gpsPulse 1.8s infinite;
    }
    @keyframes gpsPulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); }
      70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(56, 189, 248, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
    }

    /* Pins Neon de Ofertas */
    .custom-neon-pin {
      width: 22px; height: 22px; background: #00e65c; border-radius: 50%;
      border: 3px solid #ffffff; box-shadow: 0 0 15px #00e65c;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 900; color: #0b0f19;
      animation: pinGlow 1.5s infinite alternate; cursor: pointer;
    }
    @keyframes pinGlow {
      from { box-shadow: 0 0 6px #00e65c; }
      to { box-shadow: 0 0 18px #00e65c; }
    }

    /* Popups Clean */
    .leaflet-popup-content-wrapper { 
      border-radius: 12px; padding: 0; overflow: hidden; 
      background: rgba(15, 23, 42, 0.95) !important; color: #fff;
      box-shadow: 0 12px 35px rgba(0,0,0,0.7); border: 1px solid rgba(0, 230, 92, 0.4); 
    }
    .leaflet-popup-tip { background: rgba(15, 23, 42, 0.95); }
    .leaflet-popup-content { margin: 0 !important; width: 220px !important; }
    
    .card-oferta { padding: 14px; text-align: center; }
    .card-oferta .tag-placa {
      display: inline-block; background: #00e65c; color: #0b0f19; 
      font-size: 10px; font-weight: 900; padding: 3px 8px; border-radius: 4px; 
      text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px;
    }
    .card-oferta h3 { margin: 0 0 6px 0; font-size: 14px; color: #ffffff; font-weight: 700; line-height: 1.2; }
    .card-oferta img { width: 100%; height: 95px; object-fit: cover; border-radius: 6px; margin: 4px 0; border: 1px solid rgba(255,255,255,0.1); }
    .card-oferta .preco-container { margin-top: 6px; background: rgba(255,255,255,0.05); padding: 6px; border-radius: 6px; }
    .card-oferta .preco-de { text-decoration: line-through; color: #64748b; font-size: 10px; }
    .card-oferta .preco-por { color: #00e65c; font-size: 18px; font-weight: 900; }
    
    .btn-rota {
      margin-top: 10px; width: 100%; background: #00e65c; color: #0b0f19;
      border: none; padding: 9px; border-radius: 6px; font-weight: 900;
      cursor: pointer; font-size: 10px; display: flex; align-items: center; justify-content: center; gap: 4px;
      text-transform: uppercase; transition: all 0.2s;
    }
    .btn-rota:hover { background: #00c74e; }
  </style>
</head>
<body>

  <div id="header">
    <div class="origem-selector">
      <label for="select-origem">📍 Estou em:</label>
      <select id="select-origem" onchange="atualizarPontoOrigem()">
        <option value="iluminacao">Iluminação</option>
        <option value="decoracao">Decoração</option>
        <option value="organizacao">Organização</option>
        <option value="pisos">Pisos e Revestimentos</option>
        <option value="cozinhas">Cozinhas</option>
        <option value="banheiros">Banheiros</option>
        <option value="tintas">Tintas</option>
        <option value="jardim">Jardim</option>
        <option value="ferramentas">Ferramentas</option>
        <option value="ferragens">Ferragens</option>
        <option value="eletrica">Materiais Elétricos</option>
        <option value="madeiras">Madeiras</option>
        <option value="materiais">Materiais de Construção</option>
      </select>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const SPREADSHEET_ID = "1RWr4CHQMpYEIuBJ69SDULHmwxI1-4As0BuWrQSbrSG8";
    const GID = "2013806288";
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GID}`;

    // CENTROS E LIMITES REAIS DAS SEÇÕES NO PLANO CARTESIANO DO LEAFLET (1000x1000)
    // [Y, X] -> No Leaflet Simple CRS: Y é a altura (0=base, 1000=topo), X é a largura (0=esquerda, 1000=direita)
    const SECOES_MAPA = {
      "iluminacao":  { yCenter: 240, xCenter: 420, width: 100 },
      "organizacao": { yCenter: 320, xCenter: 550, width: 80 },
      "decoracao":   { yCenter: 380, xCenter: 420, width: 100 },
      "pisos":       { yCenter: 520, xCenter: 420, width: 100 },
      "retirada":    { yCenter: 650, xCenter: 420, width: 100 },
      "cozinhas":    { yCenter: 440, xCenter: 550, width: 90 },
      "banheiros":   { yCenter: 580, xCenter: 600, width: 180 },
      "tintas":      { yCenter: 440, xCenter: 660, width: 80 },
      "jardim":      { yCenter: 320, xCenter: 660, width: 80 },
      "ferramentas": { yCenter: 320, xCenter: 760, width: 80 },
      "ferragens":   { yCenter: 440, xCenter: 790, width: 80 },
      "eletrica":    { yCenter: 320, xCenter: 800, width: 90 },
      "madeiras":    { yCenter: 580, xCenter: 800, width: 80 },
      "materiais":   { yCenter: 750, xCenter: 620, width: 140 }
    };

    const bounds = [[0, 0], [1000, 1000]];
    const map = L.map('map', {
      crs: L.CRS.Simple,
      maxBounds: bounds,
      minZoom: -1.2,
      maxZoom: 2,
      zoomSnap: 0.1,
      attributionControl: false
    });

    L.imageOverlay('mapa-loja.png', bounds).addTo(map);
    map.fitBounds(bounds);

    let linhaRotaAtual = null;
    let marcadorOrigem = null;

    // Calcula a posição da placa usando deslocamento horizontal dentro da seção
    function obterCoordenadaPorPlaca(setorKey, placaNumStr, rangeStr) {
      const secao = SECOES_MAPA[setorKey];
      if (!secao) return null;

      const placaVal = parseInt(placaNumStr) || 1;
      let minPlaca = 1, maxPlaca = 20;

      if (rangeStr && rangeStr.includes('-')) {
        const partes = rangeStr.split('-').map(n => parseInt(n.trim()));
        minPlaca = partes[0] || 1;
        maxPlaca = partes[1] || 20;
      }

      const totalPlacas = Math.max(maxPlaca - minPlaca + 1, 1);
      const proporcao = Math.min(Math.max((placaVal - minPlaca) / totalPlacas, 0), 1);

      // Desloca o pino na largura da própria seção conforme o número da placa
      const posX = (secao.xCenter - secao.width / 2) + (secao.width * proporcao);
      const posY = secao.yCenter;

      return { x: Math.round(posX), y: Math.round(posY) };
    }

    function obterCoordenadaSetor(setorKey) {
      const secao = SECOES_MAPA[setorKey];
      if (!secao) return [420, 240];
      return [secao.xCenter, secao.yCenter];
    }

    function atualizarPontoOrigem() {
      const setorSel = document.getElementById('select-origem').value;
      const [x, y] = obterCoordenadaSetor(setorSel);

      if (marcadorOrigem) map.removeLayer(marcadorOrigem);
      
      const origemIcon = L.divIcon({
        className: 'gps-user-pin',
        iconSize: [16, 16],
        iconAnchor: [8, 8]
      });

      marcadorOrigem = L.marker([y, x], { icon: origemIcon }).addTo(map);
    }

    function GERAR_ROTA_AUTOMATICA(destX, destY) {
      if (linhaRotaAtual) map.removeLayer(linhaRotaAtual);

      const setorSel = document.getElementById('select-origem').value;
      const [origX, origY] = obterCoordenadaSetor(setorSel);

      // Rota usando os corredores principais do mapa
      const corredorX = 490;
      const pontosRota = [
        [origY, origX],
        [origY, corredorX],
        [destY, corredorX],
        [destY, destX]
      ];

      linhaRotaAtual = L.polyline(pontosRota, {
        color: '#00e65c',
        weight: 6,
        dashArray: '8, 8',
        lineCap: 'round'
      }).addTo(map);

      map.fitBounds(linhaRotaAtual.getBounds(), { padding: [50, 50] });
    }

    async function carregarOfertas() {
      atualizarPontoOrigem();

      try {
        const response = await fetch(CSV_URL);
        const textData = await response.text();

        const lines = textData.split('\n');
        if (lines.length < 2) return;

        const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));

        for (let i = 1; i < lines.length; i++) {
          if (!lines[i].trim()) continue;

          const values = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
          const item = {};
          
          headers.forEach((header, index) => {
            let val = values[index] ? values[index].trim() : '';
            val = val.replace(/^"|"$/g, '');
            item[header] = val;
          });

          if (String(item.ativo).trim() === "1") {
            const setorKey = (item.id_setor || '').toLowerCase().trim();
            const pos = obterCoordenadaPorPlaca(setorKey, item.placa_corredor, item.range_placas);

            if (pos) {
              const neonIcon = L.divIcon({
                className: 'custom-neon-pin',
                html: `📍`,
                iconSize: [22, 22],
                iconAnchor: [11, 11]
              });

              const card = document.createElement('div');
              card.className = 'card-oferta';
              card.innerHTML = `
                <span class="tag-placa">📍 PLACA ${item.placa_corredor || 'CORREDOR'}</span>
                <h3>${item.produto_destaque || ''}</h3>
                ${item.foto_url ? `<img src="${item.foto_url}" alt="Foto">` : ''}
                <div class="preco-container">
                  ${item.preco_de ? `<div class="preco-de">De: R$ ${item.preco_de}</div>` : ''}
                  <div class="preco-por">Por: R$ ${item.preco_por}</div>
                </div>
              `;

              const btn = document.createElement('button');
              btn.className = 'btn-rota';
              btn.innerHTML = '🚶‍♂️ Traçar Rota Até Esta Placa';
              btn.onclick = () => GERAR_ROTA_AUTOMATICA(pos.x, pos.y);
              card.appendChild(btn);

              const marker = L.marker([pos.y, pos.x], { icon: neonIcon }).addTo(map).bindPopup(card);

              marker.on('click', () => {
                GERAR_ROTA_AUTOMATICA(pos.x, pos.y);
              });
            }
          }
        }
      } catch (err) {
        console.error("Erro ao carregar dados da planilha:", err);
      }
    }

    carregarOfertas();
  </script>
</body>
</html>
