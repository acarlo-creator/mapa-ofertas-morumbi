<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ofertas da Semana - Leroy Merlin Morumbi</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; }
    body, html { 
      margin: 0; padding: 0; width: 100%; height: 100%; 
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
      background: #090d16 url('fachada.jpg') center/cover no-repeat fixed;
      overflow: hidden;
    }
    
    /* Overlay Tech no fundo com gradiente escuro */
    body::before {
      content: ""; position: absolute; top:0; left:0; right:0; bottom:0;
      background: linear-gradient(135deg, rgba(9, 13, 22, 0.92) 0%, rgba(0, 70, 27, 0.8) 100%);
      z-index: 0; backdrop-filter: blur(4px);
    }
    
    /* Header Cyber-Glass */
    #header {
      position: absolute; top: 10px; left: 10px; right: 10px; height: 55px;
      background: rgba(15, 23, 42, 0.85); color: white; display: flex; align-items: center;
      justify-content: space-between; padding: 0 14px; z-index: 1000;
      border-radius: 12px; border: 1px solid rgba(0, 230, 92, 0.4);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); backdrop-filter: blur(10px);
    }
    .brand-container { display: flex; align-items: center; gap: 8px; }
    .brand-logo { height: 28px; background: white; padding: 3px 6px; border-radius: 4px; }
    #header h1 { font-size: 14px; margin: 0; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; color: #ffffff; }
    #header .badge { 
      background: #e53935; color: white; padding: 4px 8px; border-radius: 16px; 
      font-size: 10px; font-weight: 800; letter-spacing: 0.5px;
      box-shadow: 0 0 10px rgba(229,57,53,0.8); animation: pulse 1.5s infinite; 
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(229, 57, 53, 0.7); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(229, 57, 53, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(229, 57, 53, 0); }
    }

    /* Container do Mapa */
    #map-wrapper {
      position: absolute; top: 75px; bottom: 10px; left: 10px; right: 10px;
      border-radius: 14px; border: 1px solid rgba(0, 230, 92, 0.3);
      box-shadow: 0 12px 40px rgba(0,0,0,0.6); overflow: hidden; z-index: 1;
      background: #ffffff;
    }
    #map { width: 100%; height: 100%; background: #ffffff; }

    /* Popups Tecnológicos e Compactos */
    .leaflet-popup-content-wrapper { 
      border-radius: 12px; padding: 0; overflow: hidden; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.4); border: 2px solid #008d36; 
    }
    .leaflet-popup-content { margin: 0 !important; width: 210px !important; }
    
    .card-oferta { padding: 12px; text-align: center; background: #ffffff; }
    .card-oferta .tag-campanha { 
      display: inline-block; background: #008d36; color: #fff; font-size: 9px; 
      font-weight: 900; padding: 3px 6px; border-radius: 4px; text-transform: uppercase; 
      margin-bottom: 4px; letter-spacing: 0.5px; 
    }
    .card-oferta h3 { margin: 0 0 4px 0; font-size: 13px; color: #0f172a; line-height: 1.2; font-weight: 800; }
    .card-oferta img { width: 100%; height: 95px; object-fit: cover; border-radius: 6px; margin: 4px 0; border: 1px solid #f1f5f9; }
    .card-oferta .preco-container { margin-top: 4px; background: #f8fafc; padding: 4px; border-radius: 6px; border: 1px solid #e2e8f0; }
    .card-oferta .preco-de { text-decoration: line-through; color: #94a3b8; font-size: 10px; }
    .card-oferta .preco-por { color: #e53935; font-size: 17px; font-weight: 900; margin-top: 1px; }
    
    .btn-rota {
      margin-top: 8px; width: 100%; background: #008d36; color: white;
      border: none; padding: 8px; border-radius: 6px; font-weight: 800;
      cursor: pointer; font-size: 10px; display: flex; align-items: center; justify-content: center; gap: 4px;
      box-shadow: 0 3px 8px rgba(0,141,54,0.3); transition: all 0.2s; text-transform: uppercase;
    }
    .btn-rota:hover { background: #006b29; }

    #coords-debug {
      position: absolute; bottom: 18px; left: 18px; z-index: 1000;
      background: rgba(15, 23, 42, 0.9); color: #00e65c; padding: 5px 10px;
      font-family: monospace; font-size: 10px; border-radius: 6px; 
      border: 1px solid rgba(0, 230, 92, 0.4); pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="header">
    <div class="brand-container">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d4/Leroy_Merlin.svg/512px-Leroy_Merlin.svg.png" alt="Leroy Merlin" class="brand-logo" />
      <h1>MORUMBI</h1>
    </div>
    <span class="badge">🔥 OFERTAS ATIVAS</span>
  </div>

  <div id="map-wrapper">
    <div id="map"></div>
  </div>
  
  <div id="coords-debug">X: <b>0</b> | Y: <b>0</b></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const SPREADSHEET_ID = "1RWr4CHQMpYEIuBJ69SDULHmwxI1-4As0BuWrQSbrSG8";
    const GID = "2013806288";
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GID}`;

    // Dimensões do canvas base (1000x1000)
    const bounds = [[0, 0], [1000, 1000]];
    
    // Configuração de Zoom Otimizada para encaixe completo da imagem
    const map = L.map('map', {
      crs: L.CRS.Simple,
      maxBounds: bounds,
      maxBoundsViscosity: 1.0,
      minZoom: -1.5,
      maxZoom: 2,
      zoomSnap: 0.25,
      attributionControl: false
    });

    const imageUrl = 'mapa-loja.png';
    L.imageOverlay(imageUrl, bounds).addTo(map);
    
    // Força o ajuste do enquadramento para mostrar a imagem toda de primeira
    map.fitBounds(bounds, { padding: [10, 10] });

    let linhaRotaAtual = null;

    map.on('click', function(e) {
      const y = Math.round(e.latlng.lat);
      const x = Math.round(e.latlng.lng);
      document.getElementById('coords-debug').innerHTML = `X: <b>${x}</b> | Y: <b>${y}</b>`;
    });

    function desenharRota(strRota) {
      if (linhaRotaAtual) {
        map.removeLayer(linhaRotaAtual);
      }

      if (!strRota) return;

      try {
        const pontos = strRota.split(';').map(ponto => {
          const [x, y] = ponto.split(',').map(Number);
          return [y, x];
        });

        linhaRotaAtual = L.polyline(pontos, {
          color: '#e53935',
          weight: 6,
          dashArray: '8, 8',
          lineCap: 'round'
        }).addTo(map);

        map.fitBounds(linhaRotaAtual.getBounds(), { padding: [40, 40] });
      } catch(e) {
        console.error("Erro ao desenhar rota:", e);
      }
    }

    async function carregarOfertas() {
      try {
        const response = await fetch(CSV_URL);
        const textData = await response.text();

        const lines = textData.split('\n');
        if (lines.length < 2) return;

        const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));

        for (let i = 1; i < lines.length; i++) {
          if (!lines[i].trim()) continue;

          const values = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
          const item = {};
          
          headers.forEach((header, index) => {
            let val = values[index] ? values[index].trim() : '';
            val = val.replace(/^"|"$/g, '');
            item[header] = val;
          });

          if (String(item.ativo).trim() === "1") {
            const posX = parseFloat(item.x);
            const posY = parseFloat(item.y);

            if (!isNaN(posX) && !isNaN(posY)) {
              const card = document.createElement('div');
              card.className = 'card-oferta';
              card.innerHTML = `
                <span class="tag-campanha">${item.titulo_campanha || 'Oferta'}</span>
                <h3>${item.produto_destaque || ''}</h3>
                ${item.foto_url ? `<img src="${item.foto_url}" alt="Foto">` : ''}
                <div class="preco-container">
                  ${item.preco_de ? `<div class="preco-de">De: R$ ${item.preco_de}</div>` : ''}
                  <div class="preco-por">Por: R$ ${item.preco_por}</div>
                </div>
              `;

              if (item.rota && item.rota.trim() !== "") {
                const btn = document.createElement('button');
                btn.className = 'btn-rota';
                btn.innerHTML = '🚶‍♂️ Ver Caminho Até Aqui';
                btn.onclick = () => desenharRota(item.rota);
                card.appendChild(btn);
              }

              const marker = L.marker([posY, posX]).addTo(map).bindPopup(card);

              marker.on('click', () => {
                if (item.rota) desenharRota(item.rota);
              });
            }
          }
        }
      } catch (err) {
        console.error("Erro ao carregar dados da planilha:", err);
      }
    }

    carregarOfertas();
  </script>
</body>
</html>
